name: 調査（公開中のアプリを開いてみる）
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@latest && npx playwright install --with-deps webkit chromium
      - run: node .github/diag/check.js
        env:
          APP_URL: https://script.google.com/macros/s/${{ secrets.DEPLOYMENT_ID }}/exec
