# main に変更が入ったら、Apps Script にプログラムを送り、今のウェブアプリを新バージョンに更新する（URLは変わらない）
name: Apps Script へ反映

on:
  push:
    branches: [main]
    paths: ["gas/**", "src/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - name: 設定が済んでいるか確認
        id: check
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::Secrets（CLASPRC_JSON / SCRIPT_ID / DEPLOYMENT_ID）が未登録のため反映をスキップしました。DEPLOY.md を見て登録してください。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      - name: 画面ファイルを組み立てる（src → gas/index.html）
        if: steps.check.outputs.ready == 'true'
        run: python3 src/build.py

      - name: clasp を準備
        if: steps.check.outputs.ready == 'true'
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"gas"}' "$SCRIPT_ID" > .clasp.json

      - name: Apps Script にプログラムを送る
        if: steps.check.outputs.ready == 'true'
        run: clasp push --force

      - name: ウェブアプリを新バージョンに更新（URLはそのまま）
        if: steps.check.outputs.ready == 'true'
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"

      - name: 後片付け
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json
