<script>
// 本体のプログラムが動かなかったときに、理由を画面に出す（古い書き方で書いてある）
(function () {
  function show(t) {
    if (window.__booted) return;
    var a = document.getElementById("app"); if (!a) return;
    var d = document.createElement("div"); d.className = "card"; d.style.border = "2px solid #c62828";
    d.innerHTML = "<h3>アプリを起動できませんでした</h3><p></p><p class=\"muted\">アプリを完全に閉じてから開き直してください。続くときは、この画面を管理者に見せてください。</p>";
    d.querySelector("p").textContent = t;
    a.innerHTML = ""; a.appendChild(d); window.__booted = true;
  }
  window.__stage = "見張り開始";
  window.addEventListener("error", function (ev) { show("エラー：" + (ev.message || "不明") + (ev.lineno ? "（" + ev.lineno + "行目）" : "")); }, true);
  window.onerror = function (m, s, l, c) { show("エラー：" + m + (l ? "（" + l + "行目）" : "")); };
  setTimeout(function () { var c = window.APP_CONFIG; show("起動に時間がかかりすぎています［" + window.__stage + "／設定" + (c ? (c.MODE || "?") + (c.INITIAL ? c.INITIAL.length : 0) + (c.TOKEN ? "T" : "") : "なし") + "／" + (window.google && google.script && google.script.run ? "run有" : "run無") + "］（ブラウザ：" + navigator.userAgent.replace(/^.*?\(/, "(").slice(0, 60) + "）"); }, 40000);
})();
</script>
